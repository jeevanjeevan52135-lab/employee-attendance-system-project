{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}<section class="panel error-page"><p class="error-code">{{ code }}</p><h1>This page couldn't load</h1><p>{{ message }}</p><a class="btn btn-primary" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">{{ 'Back to dashboard' if session.get('user_id') else 'Back to sign in' }}</a></section>{% endblock %}
